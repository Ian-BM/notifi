# /etc/nginx/sites-available/notifi
# Notifi SMS Platform — Production Nginx Config

upstream notifi_app {
    server 127.0.0.1:8002 fail_timeout=0;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name notifi.co.tz www.notifi.co.tz;

    # Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name notifi.co.tz www.notifi.co.tz;

    # SSL — certificates installed by Certbot
    ssl_certificate /etc/letsencrypt/live/notifi.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notifi.co.tz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logs
    access_log /var/log/nginx/notifi_access.log;
    error_log /var/log/nginx/notifi_error.log;

    # Max upload size (for CSV imports)
    client_max_body_size 10M;

    # Static files — served directly by Nginx (fast)
    location /static/ {
        alias /home/notifi/app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # Django app
    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_buffering off;
        proxy_pass http://notifi_app;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
