{% extends 'base.html' %}

{% block title %}Top Up{% endblock %}
{% block page_title %}Top Up Credits{% endblock %}

{% block content %}
<div class="card" style="max-width: 480px;">
  <div class="form-group">
    <label class="form-label">School</label>
    <input type="text" class="form-input" value="{{ school.name }}" readonly>
  </div>

  <div class="form-group">
    <label class="form-label">Current Balance</label>
    <div class="stat-value" style="font-size:24px;">{{ school.sms_balance }} credits</div>
  </div>

  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label">Credits to Add</label>
      <input type="number" name="credits" id="topup-credits" class="form-input" min="1" required>
    </div>
    <div class="form-group">
      <label class="form-label">M-Pesa Reference</label>
      <input type="text" name="reference" class="form-input" placeholder="e.g. QGH7X92K1">
    </div>

    <div class="alert alert-info">
      New balance: <strong id="new-balance-preview">{{ school.sms_balance }}</strong> credits
    </div>

    <button type="submit" class="btn btn-gold btn-block">Top Up</button>
  </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
  (function () {
    var input = document.getElementById('topup-credits');
    var preview = document.getElementById('new-balance-preview');
    var current = {{ school.sms_balance }};
    input.addEventListener('input', function () {
      var val = parseInt(input.value, 10) || 0;
      preview.textContent = current + val;
    });
  })();
</script>
{% endblock %}
